// ---------- render helper ----------
function render(panelId,w,h,camPos,target,up,labels,hideBatt,fov){
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});
  r.setPixelRatio(2);r.setSize(w,h);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
  document.getElementById(panelId).appendChild(r.domElement);
  const cam=new THREE.PerspectiveCamera(fov,w/h,1,1000);cam.position.set(...camPos);cam.up.set(...up);cam.lookAt(new THREE.Vector3(...target));
  batt.visible=!hideBatt;floor.visible=!hideBatt;
  scene.children.forEach(o=>{if(o.isMesh&&o.geometry.type==='TubeGeometry'&&o.material===mats.wireR||o.material===mats.wireB)o.visible=!hideBatt;});
  r.render(scene,cam);
  // overlay labels
  const NS='http://www.w3.org/2000/svg';const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','ov');svg.setAttribute('width',w);svg.setAttribute('height',h);
  const proj=p=>{const v=new THREE.Vector3(...p).project(cam);return [(v.x+1)/2*w,(1-v.y)/2*h];};
  labels.forEach(L=>{const [px,py]=proj(L.p);const lx=L.side=='l'?L.x:L.x;const ly=L.y;
    const ex=L.side=='l'?lx+8:lx-8;
    const path=document.createElementNS(NS,'path');path.setAttribute('d',`M${px} ${py} L${L.side=='l'?ex+40:ex-40} ${ly} L${ex} ${ly}`);path.setAttribute('stroke','#1F3A5F');path.setAttribute('stroke-width','1.6');path.setAttribute('fill','none');svg.appendChild(path);
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',px);c.setAttribute('cy',py);c.setAttribute('r',4.5);c.setAttribute('fill','#1F3A5F');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','1.5');svg.appendChild(c);
    const t=document.createElementNS(NS,'text');t.setAttribute('x',L.side=='l'?lx:lx);t.setAttribute('y',ly-4);t.setAttribute('text-anchor',L.side=='l'?'end':'start');
    t.setAttribute('style','font-size:15px;font-weight:700;fill:#1d2430');t.textContent=L.t;svg.appendChild(t);
    const s=document.createElementNS(NS,'text');s.setAttribute('x',lx);s.setAttribute('y',ly+15);s.setAttribute('text-anchor',L.side=='l'?'end':'start');s.setAttribute('style','font-size:13px;fill:#5b6675');s.textContent=L.s;svg.appendChild(s);
    if(L.side=='l'){t.setAttribute('x',lx);s.setAttribute('x',lx);} });
  document.getElementById(panelId).appendChild(svg);
}
